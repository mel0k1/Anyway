name: anyway
description: "Cross-platform OSINT workstation with a Rust core."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/brand/icon.png
  windows:
    generate: true
    icon_size: 48
  linux:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/banner.png
    - assets/brand/icon-256.png
