name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Install desktop toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build
        run: flutter pub get && flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/anyway-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: anyway-linux-x64
          path: anyway-linux-x64.tar.gz

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Build
        run: flutter pub get && flutter build windows --release
      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath anyway-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: anyway-windows-x64
          path: anyway-windows-x64.zip

  android:
    name: Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build native library
        working-directory: native
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release
      - name: Build APK
        run: flutter pub get && flutter build apk --release --target-platform android-arm64
      - name: Package
        run: cp build/app/outputs/flutter-apk/app-release.apk anyway-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anyway-android-arm64
          path: anyway-android-arm64.apk

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum anyway-linux-x64/anyway-linux-x64.tar.gz anyway-windows-x64/anyway-windows-x64.zip anyway-android-arm64/anyway-android-arm64.apk > checksums.txt
          mv anyway-linux-x64/anyway-linux-x64.tar.gz anyway-windows-x64/anyway-windows-x64.zip anyway-android-arm64/anyway-android-arm64.apk .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/anyway-linux-x64.tar.gz
            dist/anyway-windows-x64.zip
            dist/anyway-android-arm64.apk
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
