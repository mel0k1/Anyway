name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Install desktop toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build
        run: flutter pub get && flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release
          tar czf "$GITHUB_WORKSPACE/anyway-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: anyway-linux-x64
          path: anyway-linux-x64.tar.gz

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Build
        run: flutter pub get && flutter build windows --release
      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath anyway-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: anyway-windows-x64
          path: anyway-windows-x64.zip

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum anyway-linux-x64/anyway-linux-x64.tar.gz anyway-windows-x64/anyway-windows-x64.zip > checksums.txt
          mv anyway-linux-x64/anyway-linux-x64.tar.gz anyway-windows-x64/anyway-windows-x64.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            anyway-linux-x64.tar.gz
            anyway-windows-x64.zip
            checksums.txt
          generate_release_notes: true
